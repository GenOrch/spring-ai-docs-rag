# Prometheus 抓取配置（本项目的指标在 /actuator/prometheus）
# 用法：./prometheus --config.file=prometheus.yml
#      或 docker compose -f observability/docker-compose.yml up -d
# 注意：下面的 localhost targets 假设 Prometheus 以原生二进制跑在宿主机（方式 A）。
#      用 Docker（方式 B）时，容器内的 localhost 访问不到宿主机的 app/Jaeger，
#      需改用 host.docker.internal 或 host 网络模式。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-ai-docs-rag'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['localhost:8080']

  # Jaeger all-in-one 的 OTel Collector 指标（8888/metrics）
  - job_name: 'jaeger'
    static_configs:
      - targets: ['localhost:8888']
