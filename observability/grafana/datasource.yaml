# Grafana 数据源：Prometheus（指标）+ Jaeger（追踪）
# 用法一（自动加载）：放到 Grafana 的 conf/provisioning/datasources/ 下重启 Grafana。
# 用法二（手动）：Grafana UI → Connections → Data sources → 手动添加。
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://localhost:16686
    editable: true
