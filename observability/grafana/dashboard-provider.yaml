# Grafana 大盘 provider：把 dashboards/ 目录下的 4 个大盘自动加载到 `spring-ai-docs-rag` folder。
# 放到 Grafana 的 conf/provisioning/dashboards/ 下，重启后自动加载。
apiVersion: 1
providers:
  - name: spring-ai-docs-rag
    orgId: 1
    folder: spring-ai-docs-rag
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
