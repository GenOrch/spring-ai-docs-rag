# 一键起可观测后端（Jaeger + Prometheus + Grafana），Docker 用户用。
# 用法：docker compose -f observability/docker-compose.yml up -d
# Grafana 数据源 + 4 个大盘（服务运行状态 / 检索链路 / 模型成本 / 追踪）由 provisioning 自动加载。
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./grafana/dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
